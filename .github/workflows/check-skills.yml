name: check-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill frontmatter
        shell: bash
        run: |
          failed=0
          for f in skills/*/SKILL.md; do
            name=$(sed -n '/^---$/,/^---$/p' "$f" | grep -c '^name:')
            desc=$(sed -n '/^---$/,/^---$/p' "$f" | grep -c '^description:')
            if [ "$name" -lt 1 ] || [ "$desc" -lt 1 ]; then
              echo "❌ $f 缺少 name 或 description frontmatter"
              failed=1
            else
              echo "✅ $f"
            fi
          done
          exit $failed